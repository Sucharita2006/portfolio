name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 for the built-in test runner and native TypeScript, which is what
          # lets the suite run with no test framework installed.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # No environment is configured for this step, on purpose. BUILD_SPEC
      # section 1.6 requires the site to build and run with zero environment
      # variables, and a green build here is the only thing that actually proves
      # it stays true.
      - name: Build
        run: npm run build
